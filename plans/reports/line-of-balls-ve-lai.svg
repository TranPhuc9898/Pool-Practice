<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 680" font-family="-apple-system, Helvetica, sans-serif">
  <rect width="560" height="680" fill="#fff"/>
  <!-- Bàn 50x100 inch, 6 px/inch, foot ở trên như màn app -->
  <rect x="18" y="18" width="324" height="624" rx="10" fill="#6b4a32"/>
  <rect x="30" y="30" width="300" height="600" fill="#2f8f5b"/>
  <g fill="#111">
    <circle cx="30" cy="30" r="10"/><circle cx="330" cy="30" r="10"/>
    <circle cx="30" cy="330" r="9"/><circle cx="330" cy="330" r="9"/>
    <circle cx="30" cy="630" r="10"/><circle cx="330" cy="630" r="10"/>
  </g>
  <text x="180" y="14" font-size="11" fill="#333" text-anchor="middle">băng foot (băng cuối)</text>
  <text x="344" y="24" font-size="11" fill="#c00">lỗ footRight</text>
  <text x="344" y="38" font-size="10" fill="#c00">bi 1–4 vào đây</text>

  <!-- Đường bi mục tiêu 1–4 về lỗ footRight -->
  <g stroke-dasharray="4 3" stroke-width="1.4" fill="none">
    <line x1="180" y1="50.25" x2="330" y2="30" stroke="#ffd400"/>
    <line x1="180" y1="77.25" x2="330" y2="30" stroke="#4aa3ff"/>
    <line x1="180" y1="104.25" x2="330" y2="30" stroke="#ff4b3a"/>
    <line x1="180" y1="131.25" x2="330" y2="30" stroke="#d48cff"/>
  </g>

  <!-- Đường bi cái theo Diagram 1 -->
  <g fill="none" stroke-width="2.2" stroke-linejoin="round">
    <polyline points="139.2,51 166.6,52.1 133.8,84.6" stroke="#ffd400"/>
    <polyline points="133.8,84.6 167.1,81.3 127.8,133.8" stroke="#4aa3ff"/>
    <polyline points="127.8,133.8 167.9,110.2 36.75,173.4 106.8,205.8" stroke="#ff4b3a"/>
    <polyline points="106.8,205.8 168.8,138.8 196.8,43.5 243,236.4" stroke="#d48cff"/>
  </g>

  <!-- Chín bi trên đường tâm dọc, cách nhau một bi -->
  <g stroke="#000" stroke-width="0.6" font-size="7" font-weight="700" text-anchor="middle">
    <circle cx="180" cy="50.25" r="6.75" fill="#ffd400"/><text x="180" y="52.8">1</text>
    <circle cx="180" cy="77.25" r="6.75" fill="#1f5fd1"/><text x="180" y="79.8" fill="#fff" stroke="none">2</text>
    <circle cx="180" cy="104.25" r="6.75" fill="#e2261b"/><text x="180" y="106.8" fill="#fff" stroke="none">3</text>
    <circle cx="180" cy="131.25" r="6.75" fill="#6b3fa0"/><text x="180" y="133.8" fill="#fff" stroke="none">4</text>
    <circle cx="180" cy="158.25" r="6.75" fill="#ff8a00"/><text x="180" y="160.8">5</text>
    <circle cx="180" cy="185.25" r="6.75" fill="#0b7a3b"/><text x="180" y="187.8" fill="#fff" stroke="none">6</text>
    <circle cx="180" cy="212.25" r="6.75" fill="#7a1f1f"/><text x="180" y="214.8" fill="#fff" stroke="none">7</text>
    <circle cx="180" cy="239.25" r="6.75" fill="#111"/><text x="180" y="241.8" fill="#fff" stroke="none">8</text>
    <circle cx="180" cy="266.25" r="6.75" fill="#fff"/><rect x="173.5" y="263" width="13" height="6.5" fill="#ffd400" stroke="none"/><text x="180" y="268.8" stroke="none">9</text>
  </g>

  <!-- Chỗ bi cái: khởi đầu, sau cú 1, 2, 3, các phương án cho bi 5 -->
  <g fill="#fff" stroke="#000" stroke-width="0.8">
    <circle cx="139.2" cy="51" r="6.75"/>
    <circle cx="133.8" cy="84.6" r="6.75" stroke-dasharray="2 1.5"/>
    <circle cx="127.8" cy="133.8" r="6.75" stroke-dasharray="2 1.5"/>
    <circle cx="106.8" cy="205.8" r="6.75" stroke-dasharray="2 1.5"/>
    <circle cx="218.7" cy="133.8" r="5" stroke-dasharray="2 1.5"/>
    <circle cx="229.8" cy="180" r="5" stroke-dasharray="2 1.5"/>
    <circle cx="243" cy="236.4" r="6.75" stroke-dasharray="2 1.5"/>
    <circle cx="259.5" cy="302.4" r="5" stroke-dasharray="2 1.5"/>
  </g>
  <g font-size="10" fill="#fff" font-weight="600">
    <text x="88" y="48">bắt đầu</text>
    <text x="84" y="88">sau cú 1</text>
    <text x="78" y="137">sau cú 2</text>
    <text x="56" y="222">sau cú 3</text>
    <text x="226" y="131">A</text>
    <text x="237" y="178">B (tránh)</text>
    <text x="252" y="240">C</text>
    <text x="267" y="306">D</text>
  </g>
  <text x="180" y="300" font-size="10" fill="#fff" text-anchor="middle" opacity="0.8">bi 5–9: nguồn không vẽ</text>

  <!-- Chú giải -->
  <g font-size="11" fill="#222">
    <text x="352" y="80" font-weight="700">Cú theo Diagram 1</text>
    <line x1="352" y1="96" x2="372" y2="96" stroke="#ffd400" stroke-width="3"/><text x="378" y="100">1 → góc: draw, chừa góc</text>
    <text x="378" y="114">nhẹ cho bi 2</text>
    <line x1="352" y1="130" x2="372" y2="130" stroke="#4aa3ff" stroke-width="3"/><text x="378" y="134">2 → góc: draw, vị trí</text>
    <text x="378" y="148">tương tự cho bi 3</text>
    <line x1="352" y1="164" x2="372" y2="164" stroke="#ff4b3a" stroke-width="3"/><text x="378" y="168">3 → góc: thẳng lỗ, draw</text>
    <text x="378" y="182">về băng dài rồi ra</text>
    <line x1="352" y1="198" x2="372" y2="198" stroke="#d48cff" stroke-width="3"/><text x="378" y="202">4 → góc: lăn góc tự nhiên,</text>
    <text x="378" y="216">chạm băng cuối, sang bên</text>
    <text x="378" y="230">kia hàng bi (A/C/D cho bi 5)</text>
    <line x1="352" y1="248" x2="372" y2="248" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3"/><text x="378" y="252">đường bi mục tiêu</text>
    <text x="352" y="290" font-weight="700">Luật</text>
    <text x="352" y="306">Ball in hand cú đầu.</text>
    <text x="352" y="320">Ăn 1 → 9 theo thứ tự,</text>
    <text x="352" y="334">lỗ nào cũng được.</text>
    <text x="352" y="348">Đụng bi còn lại là hết lượt.</text>
    <text x="352" y="362">Điểm = số bi ăn liên tiếp.</text>
    <text x="352" y="400" font-size="10" fill="#777">Toạ độ đo từ Diagram 1,</text>
    <text x="352" y="413" font-size="10" fill="#777">BD 9/2012 (Dr. Dave).</text>
  </g>
</svg>
